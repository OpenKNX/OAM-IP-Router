;
; Hardware profiles for OAM-IP-Router: board definitions, flash layouts and the per-device flag sets.
; Split out of platformio.custom.ini so an env only states WHICH hardware it is -- same layout as
; OAM-IP-Interface (hardware / custom / custom.dev), so the two products stay diffable.
;

; ============================================================================
; Board: Waveshare ESP32-S3 Pico (REG2 ESP variant)
; ============================================================================
[custom_board_ws_esp32s3_pico]
platform = espressif32
framework = arduino
board_build.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio ;qio
board_build.flash_freq = 80m
board_build.flash_size = 16MB
board_build.hwids = [["0x303A", "0x1001"]]
board_build.mcu = esp32s3
board_build.variant = ESP32S3
board_build.extra_flags =
    -D ARDUINO_WAVESHARE_ESP32S3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0 ; 0 = native USB is NOT a serial console -> SERIAL_DEBUG=Serial runs on UART0 = external WCH USB-UART adapter (/dev/cu.wchusbserial*).
                                 ;     KNX runs on UART1 (KNX_UART_NUM=1 in ESP-S3-Pico.h), so UART0 stays free for the console -> clean serial monitor.
                                 ; 1 = console on the ESP32-S3 native USB-CDC (/dev/cu.usbmodem*), no external USB-UART adapter needed (then monitor the usbmodem port).
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D ARDUINO_USB_MODE=1
;   -U BOARD_HAS_PSRAM                    ; Disable PSRAM
;   -D CONFIG_SPIRAM_SUPPORT=0            ; Disable SPIRAM
;   -D CONFIG_SPI_MASTER_IN_IRAM=0        ; Disable SPI Master in IRAM
;   -D CONFIG_SPI_SLAVE_IN_IRAM=0         ; Disable SPI Slave in IRAM
;   -D CONFIG_SPI_FLASH_SHARE_SPI1_BUS=0  ; Disable SPI Flash share SPI1 bus
;   -D CONFIG_SPI_MASTER_IN_IRAM=0        ; Disable SPI Master in IRAM
;   -D CONFIG_SPI_SLAVE_IN_IRAM=0         ; Disable SPI Slave in IRAM
;   -D CONFIG_SPI_FLASH_SHARE_SPI1_BUS=0  ; Disable SPI Flash share SPI1 bus
;   -D CONFIG_ESP_CONSOLE_USB_SERIAL=0    ; Disable USB Serial Console
;   -D CONFIG_ESP_CONSOLE_UART_NONE=1     ; Disable UART Console
;   -D CONFIG_JTAG_ENABLE_ESP32S3=0       ; Disable JTAG
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1 ; Set CPU frequency to 240MHz
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_160=0 ; Set CPU frequency to 160MHz
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_80=0  ; Set CPU frequency to 80MHz
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_40=0  ; Set CPU frequency to 40MHz
;debug_port = /dev/cu.usbmodem84201
;upload_port = /dev/cu.usbmodem84201
;monitor_port = /dev/cu.usbmodem57640270261
;debug_tool = esp32s3-builtin
upload_speed = 921600
monitor_speed = 115200

; REG2 Pi PICO Ethernet with Display and Control Buttons

; ============================================================================
; REG2 RP2040/RP2350 web-stack flash layouts -- enlarge the sketch region for the web build (mirrors the
; interface). Reference AFTER the extends so it wins; build_unflags removes the inherited base offsets first.
; ============================================================================
[flash_reg2_rp2040_2mb_web]
build_unflags =
  -D KNX_FLASH_OFFSET=0xF4000
  -D OPENKNX_FLASH_OFFSET=0xFC000
build_flags =
  -D KNX_FLASH_OFFSET=0x114000
  -D OPENKNX_FLASH_OFFSET=0x11C000

[flash_reg2_rp2350_4mb_web]
build_unflags =
  -D KNX_FLASH_OFFSET=0xF4000
  -D OPENKNX_FLASH_OFFSET=0xFC000
build_flags =
  -D KNX_FLASH_OFFSET=0x134000
  -D OPENKNX_FLASH_OFFSET=0x13C000

; ============================================================================
; Device profiles -- one per product variant. Envs extend these; KNX_IP_LAN comes from [custom].
; NOTE: GPIO buttons run via OGM-Common native openknx.gpio (OFM-GPIOModule obsolete).
; ============================================================================

; ------ REG1 Eth (RP2040 16 MB, W5500, no display/SD) ------
[hw_reg1_eth]
extends = RP2040_16MB
build_flags =
  -D DEVICE_REG1_ETH
  -D OPENKNX_ETH_W5500                   ; wired PHY is a Wiznet W5500

; ------ REG1 LAN-TP-Base (ESP32 classic, 8 MB, NATIVE LAN8720 -- no W5500) ------
[hw_reg1_lan_tp_base]
extends = ESP32_8MB
build_flags =
  -D DEVICE_REG1_LAN_TP_BASE
  -D CONFIG_ETH_ENABLED

; ------ REG2 Pico ETH + Display + SD (2 MB, web-flash override) ------
[hw_reg2_pico_eth_dd]
extends = RP2040_2MB
board_build.filesystem_size = 913408 ; 0,87MiB -- fs starts at 0x120000, right above OPENKNX; replaces the size RP2040_EXCHANGE_2MB used to set (must stay a multiple of 4096: 223*4096)
build_unflags = ${flash_reg2_rp2040_2mb_web.build_unflags}
build_flags =
  ${flash_reg2_rp2040_2mb_web.build_flags}
  -D DEVICE_REG2_PIPICO_V1_ETH_DD
  -D OPENKNX_SDCARD
  -D DEVICE_DISPLAY_MODULE
  -D OPENKNX_ETH_W5500                   ; wired PHY is a Wiznet W5500
  -D OPENKNX_ETH_AUTO_FALLBACK           ; W5500 auto link-speed fallback on flapping (RP2040 live)

; ------ REG2 Pico W ETH + Display + SD (2 MB, web-flash override) ------
; KNX_IP_WIFI is not supported on rp2040 -- this board runs LAN only (REG2 W5500 Lite App).
[hw_reg2_pico_w_eth_dd]
extends = RP2040_2MB
board_build.filesystem_size = 913408 ; 0,87MiB -- fs starts at 0x120000, right above OPENKNX; replaces the size RP2040_EXCHANGE_2MB used to set (must stay a multiple of 4096: 223*4096)
build_unflags = ${flash_reg2_rp2040_2mb_web.build_unflags}
build_flags =
  ${flash_reg2_rp2040_2mb_web.build_flags}
  -D DEVICE_REG2_PIPICO_W_V1_ETH_DD
  -D OPENKNX_SDCARD
  -D DEVICE_DISPLAY_MODULE
  -D OPENKNX_ETH_W5500                   ; wired PHY is a Wiznet W5500
  -D OPENKNX_ETH_AUTO_FALLBACK           ; W5500 auto link-speed fallback on flapping (RP2040 live)

; ------ REG2 Pico2 (RP2350) ETH + Display + SD (4 MB, web-flash override) ------
[hw_reg2_pico2_eth_dd]
extends = RP2040_4MB
board = rpipico2
board_build.filesystem_size = 2879488 ; 2,75MiB -- fs starts at 0x140000, right above OPENKNX; replaces the size RP2040_EXCHANGE_4MB used to set (must stay a multiple of 4096: 703*4096)
build_unflags = ${flash_reg2_rp2350_4mb_web.build_unflags}
build_flags =
  ${flash_reg2_rp2350_4mb_web.build_flags}
  -D DEVICE_REG2_PIPICO2_V1_ETH_DD
  -D OPENKNX_SDCARD
  -D DEVICE_DISPLAY_MODULE
  -D OPENKNX_ETH_W5500                   ; wired PHY is a Wiznet W5500
  -D OPENKNX_ETH_AUTO_FALLBACK           ; W5500 auto link-speed fallback on flapping (RP2040 live)
  -UUSE_KNX_DMA_UART                     ; not supported on Pico2 yet
  -UUSE_KNX_DMA_IRQ                      ; not supported on Pico2 yet

; ------ REG2 ESP32-S3 (Waveshare Pico) ETH + Display + SD (16 MB) ------
; ESP32 board/platform ordering is order-sensitive: the env extends this block THEN custom_release_ESP32
; (so the pioarduino platform from the release base wins over the board's espressif32).
[hw_reg2_esp_eth_dd]
extends = custom_board_ws_esp32s3_pico, ESP32_16MB
build_flags =
  -D DEVICE_REG2_ESP_S3_PICO_V1_DD
  -D OPENKNX_SDCARD
  -D DEVICE_DISPLAY_MODULE
  -D CONFIG_ETH_ENABLED
  -D OPENKNX_ETH_W5500                   ; W5500 (REG1_LAN_TP_BASE uses native LAN8720 -> not set there)
  -D OPENKNX_ETH_AUTO_FALLBACK           ; W5500 auto link-speed fallback on flapping (ESP32 live via esp_eth_ioctl)
  -D CONFIG_IDF_TARGET_ESP32S3
