;
; global custom
;
[custom]
build_flags =
  -D MASK_VERSION=0x091A
  -D KNX_TUNNELING=16
  -D KNX_TUNNELING_DEVMGMT=2
  -D KNX_TUNNELING_NO_TUNNEL_PA_ON_TP ; if defined, device does not send unicast frames which a DestAddr that matches an acive tunnel connection to the TP line
  ;-D KNX_ROUTING_BC_DC ; if defined, all unicast frames from the device itself are sent on all network interfaces (IP + TP)
  -D KNX_TUNNELING_STRICT_TOPOLOGY ; Tunnel-Unicast fuer FREMDE Linie/Area NICHT auf TP schicken (laeuft via IP-Routing zum Ziel). Feld-bestaetigt 2026-06-30: fixt den PE-Flood beim Proggen von 1.x-Geraeten durch den 2.0.0-Router (Protocol-Error 0 statt Sekundentakt). Korrektes Koppler-Verhalten; falsch nur bei flacher Fehl-Topologie (1.x-Geraet faelschlich auf der 2.x-Linie). Siehe lib/knx/README.md (Build flags).
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_NETWORK_USEIPPROP
  ;-D KNX_SERVICE_FAMILY_CORE=0x02
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -D MAX_RX_QUEUE_BYTES=2048
  -D MAX_TX_QUEUE=100
  -I lib/OGM-HardwareConfig/include/
  ;-D OPENKNX_LEDEFFECT_ACTIVITY_DURATION=100
  ;-D OPENKNX_DUALCORE
  ;-D TPUART_RX_TIMEOUT_DEBUG
  ;-D TPUART_RX_TIMEOUT=60

; ============================================================================
; EC build-flag sets -- steer TPUart/knx switches centrally here (not per-env).
;   TPUART_* flags : see lib/TPUart/README.md          (flag table)
;   KNX_*    flags : see lib/knx/README.md              (Build flags / configuration switches)
; ============================================================================
[ec_flags_esp32]
build_flags =
  ; --- TPUart stability/perf (ESP32) -- see lib/TPUart/README.md ---
  -D TPUART_BCU_AUTORECONNECT     ; BCU self-heals a mute/desynced NCN ("BCU disconnected" gone)
  -D TPUART_RX_DRAIN_FAST         ; ESP32: drain whole RX ring, rx-threshold=1 (ETS app-proggen ok, A/B-confirmed)
  -D TPUART_TX_FAST               ; ESP32: higher IP->TP forward rate (no queue-full under load)
  -D TPUART_BCU_HEALTH            ; 'bcu' report shows BCU<Health> + BCU<NCN-Err>
  -D TPUART_TX_STICKY_OFFSET      ; send U_L_DataOffset only on change (NCN5130 DS p.42: chip keeps it)
                                  ; saves 195 of 725 UART bytes per 263-octet frame; A/B-measured
  -D KNX_FIXES_EC                 ; knx robustness fixes (S1 reaper/cEMI OOB...) -- see lib/knx/README.md (field build 7.6.1)
  -D TPUART_BCU_BACKSTOP          ; 60s lost-CON stall -> ~8s guarded fast reset (RP-safe, degrades to 60s on persistent fault)
  -D TPUART_NCN_TW_AUTORESET      ; NCN thermal-warning auto-heal: one guarded U_RESET on a latched TW (L1 edge-log is always on)
  ; opt-in (default off = stock):
  ; -D TPUART_BCU_DEBUG           ; test hooks: 'bcu dis' + WD/CONr logs

[ec_flags_rp]
build_flags =
  ; --- TPUart stability (RP2040/RP2350) -- see lib/TPUart/README.md ---
  ; NOTE: RX_DRAIN_FAST / TX_FAST are ESP32-only (no effect on RP) -> intentionally not here.
  -D TPUART_BCU_AUTORECONNECT     ; platform-agnostic
  -D TPUART_BCU_HEALTH
  -D TPUART_TX_STICKY_OFFSET      ; platform-agnostic; see ec_flags_esp32 for the why
  -D KNX_FIXES_EC                 ; see lib/knx/README.md
  -D TPUART_NCN_TW_AUTORESET      ; platform-agnostic; NCN TW auto-heal (see ec_flags_esp32); U_RESET is the clean protocol reset
  ; -D TPUART_BCU_BACKSTOP
  ; -D TPUART_BCU_DEBUG

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D DEBUG_LOOP_TIME=10 ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE3=DummyChannel<1>"
  ; "-D OPENKNX_TRACE4=DummyChannel<[3-5]>"
  ;-D KNX_LOG_COUPLER
  ;-D DEBUG_TP_FRAMES
  ;-D KNX_LOG_TUNNELING
  ;-D OPENKNX_RUNTIME_STAT
  ;-D OPENKNX_RUNTIME_STAT_BUCKETN=10
  -D OPENKNX_LOOPTIME_WARNING=15
  ;-D OPENKNX_DEBUG_HEAP_LOG ; ESP32: periodic HEAP free/min/largest (+DMA) log every 10s (on-demand alternative: console 'mem')
  ;"-D OPENKNX_RUNTIME_STAT_BUCKETS=5000, 10000, 15000, 20000, 30000, 40000, 50000, 100000, 200000"


[custom_develop_RP2040]
extends = RP2040_develop, custom_develop
build_flags =
  ${RP2040_develop.build_flags}
  ${custom_develop.build_flags}
  ${ec_flags_rp.build_flags}

[custom_release_RP2040]
extends = RP2040_releases, custom
build_flags =
  ${RP2040_releases.build_flags}
  ${custom.build_flags}
  -D OPENKNX_LOOPTIME_WARNING=50
  ${ec_flags_rp.build_flags}


[custom_develop_ESP32]
extends = ESP32_develop, custom_develop
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
build_flags =
  ${ESP32_develop.build_flags}
  ${custom_develop.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ${ec_flags_esp32.build_flags}
  ;-D CONFIG_HEAP_CORRUPTION_DETECTION=CONFIG_HEAP_POISONING_COMPREHENSIVE

[custom_release_ESP32]
extends = ESP32_releases, custom
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
build_flags =
  ${ESP32_releases.build_flags}
  ${custom.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D OPENKNX_LOOPTIME_WARNING=50
  ${ec_flags_esp32.build_flags}

; ------ REG1-Eth ------
[env:develop_REG1_ETH]
extends = custom_develop_RP2040, RP2040_16MB, RP2040_EXCHANGE_16MB, RP2040_UPLOAD_USB
build_flags =
   ${custom_develop_RP2040.build_flags}
   ${RP2040_EXCHANGE_16MB.build_flags}
  -D DEVICE_REG1_ETH
  -D KNX_IP_LAN

[env:develop_REG1_ETH_JLINK]
extends = env:develop_REG1_ETH, UPLOAD_JLINK

; ------ REG1-LAN-TP-Base ------
[env:develop_REG1_LAN_TP_BASE]
extends = custom_develop_ESP32, ESP32_8MB
build_flags =
   ${custom_develop_ESP32.build_flags}
  ;-D DEVICE_DEV_REG1_LAN_TP_Base_V00_02
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN
  -D CONFIG_ETH_ENABLED
   ${ec_flags_esp32.build_flags}  ; central TPUart/knx switches -- steer in [ec_flags_esp32] (see lib/TPUart & lib/knx READMEs)

[env:develop_REG1_LAN_TP_BASE_JTAG]
extends = custom_develop_ESP32, ESP32_8MB, UPLOAD_ESP_PROG
build_flags =
   ${custom_develop_ESP32.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN
  -D CONFIG_ETH_ENABLED



; ; Releases
[env:release_REG1_ETH]
extends = custom_release_RP2040, RP2040_16MB, RP2040_EXCHANGE_16MB
build_flags =
   ${custom_release_RP2040.build_flags}
   ${RP2040_EXCHANGE_16MB.build_flags}
  -D DEVICE_REG1_ETH
  -D KNX_IP_LAN
  -D OPENKNX_ETH_W5500 ; wired PHY is a Wiznet W5500

[env:release_REG1_LAN_TP_BASE]
extends = custom_release_ESP32, ESP32_8MB
build_flags =
   ${custom_release_ESP32.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN
  -D CONFIG_ETH_ENABLED
  -D OPENKNX_FTC                  ; KNX file-transfer client (`ftc` console cmd). 
  -D OPENKNX_FTC_CONSOLE          ; KNX file-transfer client console output (see lib/OFM-FileTransferModule/README.md) 
   ${ec_flags_esp32.build_flags}  ; central TPUart/knx switches -- steer in [ec_flags_esp32] (see lib/TPUart & lib/knx READMEs)

; ============================================================================
; REG2 hardware variants (Pico / PicoW / Pico2 / ESP32-S3) - Display + SD-Card
; NOTE: GPIO buttons run via OGM-Common native openknx.gpio (OFM-GPIOModule obsolete)
; ============================================================================
[custom_board_ws_esp32s3_pico]
platform = espressif32
framework = arduino
board_build.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio ;qio
board_build.flash_freq = 80m
board_build.flash_size = 16MB
board_build.hwids = [["0x303A", "0x1001"]]
board_build.mcu = esp32s3
board_build.variant = ESP32S3
board_build.extra_flags =
    -D ARDUINO_WAVESHARE_ESP32S3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0 ; 0 = native USB is NOT a serial console -> SERIAL_DEBUG=Serial runs on UART0 = external WCH USB-UART adapter (/dev/cu.wchusbserial*).
                                 ;     KNX runs on UART1 (KNX_UART_NUM=1 in ESP-S3-Pico.h), so UART0 stays free for the console -> clean serial monitor.
                                 ; 1 = console on the ESP32-S3 native USB-CDC (/dev/cu.usbmodem*), no external USB-UART adapter needed (then monitor the usbmodem port).
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D ARDUINO_USB_MODE=1
;   -U BOARD_HAS_PSRAM                    ; Disable PSRAM
;   -D CONFIG_SPIRAM_SUPPORT=0            ; Disable SPIRAM
;   -D CONFIG_SPI_MASTER_IN_IRAM=0        ; Disable SPI Master in IRAM
;   -D CONFIG_SPI_SLAVE_IN_IRAM=0         ; Disable SPI Slave in IRAM
;   -D CONFIG_SPI_FLASH_SHARE_SPI1_BUS=0  ; Disable SPI Flash share SPI1 bus
;   -D CONFIG_SPI_MASTER_IN_IRAM=0        ; Disable SPI Master in IRAM
;   -D CONFIG_SPI_SLAVE_IN_IRAM=0         ; Disable SPI Slave in IRAM
;   -D CONFIG_SPI_FLASH_SHARE_SPI1_BUS=0  ; Disable SPI Flash share SPI1 bus
;   -D CONFIG_ESP_CONSOLE_USB_SERIAL=0    ; Disable USB Serial Console
;   -D CONFIG_ESP_CONSOLE_UART_NONE=1     ; Disable UART Console
;   -D CONFIG_JTAG_ENABLE_ESP32S3=0       ; Disable JTAG
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1 ; Set CPU frequency to 240MHz
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_160=0 ; Set CPU frequency to 160MHz
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_80=0  ; Set CPU frequency to 80MHz
;   -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_40=0  ; Set CPU frequency to 40MHz
;debug_port = /dev/cu.usbmodem84201
;upload_port = /dev/cu.usbmodem84201
;monitor_port = /dev/cu.usbmodem57640270261
;debug_tool = esp32s3-builtin
upload_speed = 921600
monitor_speed = 115200

; REG2 Pi PICO Ethernet with Display and Control Buttons
[env:release_REG2_PICO_ETH_DD]
extends = custom_release_RP2040, RP2040_2MB, RP2040_EXCHANGE_2MB
build_flags =
  ${custom_release_RP2040.build_flags}
  ${RP2040_EXCHANGE_2MB.build_flags}
  -D DEVICE_REG2_PIPICO_V1_ETH_DD
  -D OPENKNX_SD_CARD_MODULE_ENABLE
  -D DEVICE_DISPLAY_MODULE
  ;-D DEVICE_DISPLAY_MODULE_SSD1315 ; Display Module is SSD1315 - Replace with SSD1306 support if needed
  -D KNX_IP_LAN
  -D OPENKNX_ETH_W5500 ; wired PHY is a Wiznet W5500
  -D OPENKNX_ETH_AUTO_FALLBACK ; W5500 auto link-speed fallback on flapping (RP2040 live)

; REG2 Pi PICO W Ethernet (LAN only) with Display and Control Buttons
[env:release_REG2_PICO_W_ETH_DD] 
extends = custom_release_RP2040, RP2040_2MB, RP2040_EXCHANGE_2MB
build_flags =
  ${custom_release_RP2040.build_flags}
  ${RP2040_EXCHANGE_2MB.build_flags}
  -D DEVICE_REG2_PIPICO_W_V1_ETH_DD
  -D OPENKNX_SD_CARD_MODULE_ENABLE
  -D DEVICE_DISPLAY_MODULE
 ;-D DEVICE_DISPLAY_MODULE_SSD1315 ; Display Module is SSD1315 - Replace with SSD1306 support if needed
  ;-D KNX_IP_WIFI ; Currently not supported on rp2040.
  -D KNX_IP_LAN ; Only in Combination with REG2 W5500 Lite App
  -D OPENKNX_ETH_W5500 ; wired PHY is a Wiznet W5500
  -D OPENKNX_ETH_AUTO_FALLBACK ; W5500 auto link-speed fallback on flapping (RP2040 live)

; REG2 Pi PICO 2 Ethernet with Display and Control Buttons
[env:release_REG2_PICO2_ETH_DD]
extends = custom_release_RP2040, RP2040_4MB, RP2040_EXCHANGE_4MB
board = rpipico2
build_flags =
  ${custom_release_RP2040.build_flags}
  ${RP2040_EXCHANGE_4MB.build_flags}
  -D DEVICE_REG2_PIPICO2_V1_ETH_DD
  -D OPENKNX_SD_CARD_MODULE_ENABLE
  -D DEVICE_DISPLAY_MODULE
  -D OPENKNX_FTC                  ; KNX file-transfer client (`ftc` console cmd)
  -D OPENKNX_FTC_CONSOLE          ; ftc console output (see lib/OFM-FileTransferModule/README.md)
  ;-D DEVICE_DISPLAY_MODULE_SSD1315 ; Display Module is SSD1315 - Replace with SSD1306 support if needed
  -D KNX_IP_LAN
  -D OPENKNX_ETH_W5500 ; wired PHY is a Wiznet W5500
  -D OPENKNX_ETH_AUTO_FALLBACK ; W5500 auto link-speed fallback on flapping (RP2040 live)
  -UUSE_KNX_DMA_UART ; Disable USE_KNX_DMA_UART - Currentyl not supporting the Pico2!
  -UUSE_KNX_DMA_IRQ ; Disable USE_KNX_DMA_IRQ - Currentyl not supporting the Pico2!

; REG2 ESP32 PICO Ethernet with Display and Control Buttons
[env:release_REG2_PICO_ESP_ETH_DD]
extends = custom_board_ws_esp32s3_pico, custom_release_ESP32, ESP32_16MB
build_flags =
   ${custom_release_ESP32.build_flags}
  -D DEVICE_REG2_ESP_S3_PICO_V1_DD
  -D OPENKNX_SD_CARD_MODULE_ENABLE
  -D DEVICE_DISPLAY_MODULE
  -D DEVICE_DISPLAY_MODULE_SSD1315 ; Display Module is SSD1315 - Replace with SSD1306 support if needed
  -D KNX_IP_LAN
  -D CONFIG_ETH_ENABLED
  -D OPENKNX_ETH_W5500 ; wired PHY is a Wiznet W5500 (REG2 ESP; REG1_LAN_TP_BASE uses native LAN8720 -> NOT set)
  -D OPENKNX_ETH_AUTO_FALLBACK ; W5500 auto link-speed fallback on flapping (ESP32 live via esp_eth_ioctl)
  -D CONFIG_IDF_TARGET_ESP32S3
  ; --- DIAGNOSE (nur Dev, im Release auskommentiert lassen) ---
  ; Heap-Integrity-Stolperdraht: prüft den Heap an jedem Boot-Restore-Schritt und meldet den ersten
  ; korrupten Marker (HEAPCHK). Siehe OGM-Common README (Debug & Development). Kostet Boot-Latenz.
  ;-D OPENKNX_HEAP_INTEGRITY_TRACE
  -D OPENKNX_FTC                  ; KNX file-transfer client (`ftc` console cmd)
  -D OPENKNX_FTC_CONSOLE          ; ftc console output (see lib/OFM-FileTransferModule/README.md)
