[platformio]
; Central, cross-project dep store shared by all OpenKNX siblings. Persistent -- do NOT use /tmp:
; macOS wipes /private/tmp on reboot (and the periodic 3-day cleanup) -> every build re-downloads.
libdeps_dir = ${sysenv.HOME}/.pio-libdeps-openknx
extra_configs =
  lib/OGM-Common/platformio.base.ini
  lib/OGM-Common/platformio.rp2040.ini
  lib/OGM-Common/platformio.esp32.ini
  lib/OFM-Network/platformio.network.ini
  platformio.hardware.ini
  platformio.custom.ini
  platformio.custom.dev.ini
