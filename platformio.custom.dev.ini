;
; OAM-IP-Router -- DEVELOP bases and DEVELOP environments.
; Release side + product-wide flags -> platformio.custom.ini ; hardware -> platformio.hardware.ini
;
[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D DEBUG_LOOP_TIME=10 ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE3=DummyChannel<1>"
  ; "-D OPENKNX_TRACE4=DummyChannel<[3-5]>"
  ;-D KNX_LOG_COUPLER
  ;-D DEBUG_TP_FRAMES
  ;-D KNX_LOG_TUNNELING
  ;-D OPENKNX_RUNTIME_STAT
  ;-D OPENKNX_RUNTIME_STAT_BUCKETN=10
  -D OPENKNX_LOOPTIME_WARNING=15
  ;-D OPENKNX_DEBUG_HEAP_LOG ; ESP32: periodic HEAP free/min/largest (+DMA) log every 10s (on-demand alternative: console 'mem')
  ;"-D OPENKNX_RUNTIME_STAT_BUCKETS=5000, 10000, 15000, 20000, 30000, 40000, 50000, 100000, 200000"

; ----------------------------------------------------------------------------
; Develop platform bases (mirror the release bases, minus the release-only bits).
; Unlike the interface's lean debug build, the router's develop builds DO carry the web stack --
; that is how they were before the ini split, and the 16 MB REG1 targets have the room.
; ----------------------------------------------------------------------------
[custom_develop_RP2040]
extends = RP2040_develop, custom_develop
build_flags =
  ${RP2040_develop.build_flags}
  ${custom_develop.build_flags}
  ${web.build_flags}
  ${flags_rp.build_flags}

[custom_develop_ESP32]
extends = ESP32_develop, custom_develop
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
build_flags =
  ${ESP32_develop.build_flags}
  ${custom_develop.build_flags}
  ${web.build_flags}
  ${flags_esp32.build_flags}
  ;-D CONFIG_HEAP_CORRUPTION_DETECTION=CONFIG_HEAP_POISONING_COMPREHENSIVE

; ============================================================================
; DEVELOP ENVIRONMENTS  (hardware -> platformio.hardware.ini [hw_*])
; ============================================================================

; ------ REG1 (reference boards) ------
[env:develop_REG1_ETH]                   ; RP2040 16 MB, W5500 ETH, USB upload
extends = custom_develop_RP2040, hw_reg1_eth, RP2040_UPLOAD_USB
build_flags =
  ${custom_develop_RP2040.build_flags}
  ${hw_reg1_eth.build_flags}

[env:develop_REG1_ETH_JLINK]             ; ^ via J-Link
extends = env:develop_REG1_ETH, UPLOAD_JLINK

[env:develop_REG1_LAN_TP_BASE]           ; ESP32 classic, 8 MB, native ETH
extends = custom_develop_ESP32, hw_reg1_lan_tp_base
build_flags =
  ${custom_develop_ESP32.build_flags}
  ${hw_reg1_lan_tp_base.build_flags}

[env:develop_REG1_LAN_TP_BASE_JTAG]      ; ^ via ESP-PROG JTAG
extends = custom_develop_ESP32, hw_reg1_lan_tp_base, UPLOAD_ESP_PROG
build_flags =
  ${custom_develop_ESP32.build_flags}
  ${hw_reg1_lan_tp_base.build_flags}
