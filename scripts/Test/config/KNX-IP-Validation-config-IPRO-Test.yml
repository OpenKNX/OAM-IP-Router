# ══════════════════════════════════════════════════════════════════════════════
#  KNX/IP Validation Tool - test configuration
#  OAM-IP-Router (IPRO) - KNXnet/IP router, mask 091A, TP1 medium
#  2026 OpenKNX - Erkan Colak
# ══════════════════════════════════════════════════════════════════════════════
#
#  FORMAT - read this before editing
#  ---------------------------------
#  This is the shape the TOOL itself writes: an "include" list of tree paths and
#  test ids. Saving from inside the tool REWRITES this file and DROPS EVERY
#  COMMENT - re-apply them afterwards, or the reasons below are gone.
#  Because this is an include list, what is EXCLUDED is invisible. Every omission
#  is therefore written out here.
#
#  Device under test: 11.11.0.126, PA 1.1.0, mask 091A,
#  families CORE v1 - DEVICE_MANAGEMENT v2 - TUNNELLING v1 - ROUTING v2.
#
#  ── What is left out, and why ────────────────────────────────────────────────
#
#  Core v2 / TCP (10701-10731), extended discovery (10902-10920)
#      CORE is advertised as v1.
#
#  Tunnelling v2 feature services (30401-30428)
#      TUNNELLING is advertised as v1; 03_08_04 3.5 tells a server that does not
#      support them to ignore them.
#
#  KNX Busmonitor mode (30107)
#      A device that advertises ROUTING may NOT offer a bus monitor
#      (03_08_04 2.2.4 p.8). Refusing it is the conformant answer - the opposite
#      of the interface, which advertises no routing and therefore may offer it.
#
#  cEMI raw mode (30105)
#      Optional (03_08_04 7.2 p.35), not supported. Refused with E_CONNECTION_OPTION
#      (0x23) as 08_TSSH 5.1.3 p.64 and 03_08_04 Figure 6 p.27 give it; the text of
#      step 4.a p.28 names E_TUNNELING_LAYER (0x29). References 2026-10-03: MDT 0x29,
#      Siemens N148 0x23. The bus monitor (30107) is refused with 0x23 too. Both
#      left out until a run on the 23h build is measured.
#
#  Remote Configuration and Diagnosis (50101-50510)
#      REMOTE_CONF_DIAG is not advertised.
#
#  KNX IP end device (60101, 60102)
#      TP1 device with an IP side (medium 0x02), not a KNX IP end device (0x20).
#
#  Programming mode by memory access (20208)
#      03_05_01 4.26 p.303: type 1 IS the property PID_PROG_MODE; type 2 is the
#      memory cell 0060h and 4.26.3 lists its users - "Ctrl-Mode fixed DMA,
#      Ctrl-Mode reloc DMA, masks 0012h, 0020h, 0021h, 0701h in E-Mode". 091A is
#      NOT among them: it is a System B device and uses type 1, which 20207
#      measures. Honouring it would let a tool write into NVM offset 0x60, which
#      is inside the saved interface-object image.
#
#  ── DELIBERATELY IN, and expected to be interesting ──────────────────────────
#
#  Routing (30201-30203, 40101-40315) and 80130
#      On RP2040 the router advertises ROUTING v2, so [80130] (version >= 2) measures it;
#      an ESP32 router still advertises ROUTING v1 and fails 80130.
#
#  cEMI Transport Layer (60202-60206)
#      03_08_03 2.6.1.1 p.18 requires the MODE of ANY device that uses KNXnet/IP
#      Device Management, independently of the version; only the T_Data_*
#      services are version dependent (4.2.5 p.23 marks them X at v1). The mode
#      and the services are now built on this product too, so all five are real
#      measurements. Unlike on the interface, 60202 can be delivered as intended
#      here, because this device HAS routing and the tool can send the T_Connect
#      as a ROUTING_INDICATION.
#
#  ── Setup - the part that decides whether the run means anything ─────────────
#
#  Configure the SECOND bus connection in the tool, or every "from KNX" case
#  fails for a rig reason.
#
#  QUIET BUS: this router couples the production line onto the test line. On
#  2026-09-06 the test line carried ~1.2 foreign telegrams per second, sourced
#  from 11.11.0.3 (Siemens N 146/02, 1.0.0) and 11.11.0.31 (OpenKNX REG2-ESP,
#  2.0.0) over routing multicast 224.0.23.12. That noise produced failures that
#  say nothing about the device.
#  Do NOT solve it by moving this router to another routing multicast group:
#  measured 2026-09-06, the device then disappears from discovery entirely
#  (it joins only its routing group, so SEARCH_REQUEST on the fixed system setup
#  address 224.0.23.12 never reaches it - 03_08_02 8.5.2.1 p.48). A restart does
#  not repair the membership either. Both are open device findings; see doc/.
#  Until they are fixed, isolate at the ETHERNET level (separate segment, as
#  TSSH 1.2.1 asks for anyway) or power down the two other routers.
# ══════════════════════════════════════════════════════════════════════════════

include:
# ── 00 Setup ─────────────────────────────────────────────────────────────────
- KNX/00 Setup

# ── 01 Core - complete, all six sections ─────────────────────────────────────
- KNX/01 Core/01 Unspecific
- KNX/01 Core/02 SEARCH_REQUEST
- KNX/01 Core/03 DESCRIPTION_REQUEST
- KNX/01 Core/04 CONNECT_REQUEST
- KNX/01 Core/05 CONNECTIONSTATE_REQUEST
- KNX/01 Core/06 DISCONNECT_REQUEST

# ── 02 Device Management ─────────────────────────────────────────────────────
- KNX/02 Device Management/01 Device Management CONNECT_REQUEST
# 02 DEVICE_CONFIGURATION_REQUEST per id: 20208 is left out (see header)
- 20201
- 20202
- 20203
- 20204
- 20205
- 20206
- 20207
- 20209
- 20210
- 20211
- 20212
- KNX/02 Device Management/03 cEMI Transport Layer

# ── 03 Tunnelling ────────────────────────────────────────────────────────────
# 01 CONNECT_REQUEST per id: 30105 (raw mode) and 30107 (bus monitor) left out
- 30101
- 30102
- 30108
- KNX/03 Tunneling/02 TUNNELING_REQUEST
- KNX/03 Tunneling/03 Tunnel Addresses
- KNX/03 Tunneling/04 NAT Compatible Tunneling

# ── 04 Routing - the part that makes this a router ───────────────────────────
- KNX/04 Routing

# ── 06 Medium - cEMI Transport Layer ─────────────────────────────────────────
# 60101/60102 (KNX IP end device) are left out; DEVICE_MANAGEMENT v2 is advertised
- 60201
- 60202
- 60203
- 60204
- 60205
- 60206

# ── 07 Security ──────────────────────────────────────────────────────────────
- KNX/07 Security

# ── 08 System Broadcast ──────────────────────────────────────────────────────
- KNX/08 System Broadcast

exclude: []

parameters:
# [30213] sends a tunnelled MaskVersionRead here and expects the answer to carry
# this address as source. Any answering TP device works (our suite: H-5.2.10).
- id: 30213
  parameters:
    Device address of load switch: 1.1.5

# [40315] sends 1000 ROUTING_INDICATIONs to this address and counts them on the tool's bus connection. The MDT
# tunnel passes individually addressed telegrams to a client only when they are addressed to the client's own
# tunnel address (to a bench device's address the tool counts 0 of 1000), so it is the MDT tunnel address
# the tool's connection gets: 1.1.192, the MDT's first tunnel address while the tool is its only client.
- id: 40315
  parameters:
    DestinationIA: 1.1.192
# [30110] [30111] [30113] [30114] write PID_ADDITIONAL_INDIVIDUAL_ADDRESSES (not permanent) starting here;
# kept inside line 1.1, clear of the bench devices and of the tunnel ranges 1.1.111 (.210), 1.1.192 (MDT), 1.1.220 (router).
- id: 30110
  parameters:
    First Tunnel Address: 1.1.150
- id: 30111
  parameters:
    First Tunnel Address: 1.1.150
- id: 30113
  parameters:
    First Tunnel Address: 1.1.150
- id: 30114
  parameters:
    First Tunnel Address: 1.1.150

systemparameters:
# Set to true when the device under test draws its supply from the TP line, so
# the tool does not expect an answer after it opens the TP connection.
# 11.11.0.126 is a REG2 with external supply (a REG1 is bus-powered: true).
- name: BdutIsTp1Powered
  value: false
