;
; OAM-IP-Router -- product-wide flags, feature blocks, release bases and RELEASE environments.
;   hardware (boards / flash layouts / device profiles) -> platformio.hardware.ini
;   develop bases + develop environments               -> platformio.custom.dev.ini
;
[custom]
build_flags =
  -D MASK_VERSION=0x091A
  -D KNX_IP_LAN                         ; IP transport = wired LAN (all targets)
  -D KNX_TUNNELING=16
  -D KNX_TUNNELING_DEVMGMT=2
  -D KNX_TUNNEL_RESEND ; server-side TUNNELLING/DEVICE_CONFIG resend (03_08_04 §2.6.1 / 03_08_03): config 10s/3x, data 1s/1x. +~15KB RAM (FIFO x18). On buffer overflow drops best-effort group frames (keeps the connection under routing load), disconnects only on CO overflow.
  -D KNX_TUNNELING_NO_TUNNEL_PA_ON_TP ; if defined, device does not send unicast frames which a DestAddr that matches an acive tunnel connection to the TP line
  ;-D KNX_ROUTING_BC_DC ; if defined, all unicast frames from the device itself are sent on all network interfaces (IP + TP)
  -D KNX_TUNNELING_STRICT_TOPOLOGY ; Tunnel-Unicast fuer FREMDE Linie/Area NICHT auf TP schicken (laeuft via IP-Routing zum Ziel). Feld-bestaetigt 2026-06-30: fixt den PE-Flood beim Proggen von 1.x-Geraeten durch den 2.0.0-Router (Protocol-Error 0 statt Sekundentakt). Korrektes Koppler-Verhalten; falsch nur bei flacher Fehl-Topologie (1.x-Geraet faelschlich auf der 2.x-Linie). Siehe lib/knx/README.md (Build flags).
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_NETWORK_USEIPPROP
  ;-D KNX_SERVICE_FAMILY_CORE=0x02
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -I lib/OGM-HardwareConfig/include/
  -D OPENKNX_FTC_SECURITY         ; FTC access control (FTM_Security stage + password); opts into FileTransfer.share.xml params. Share carries 0 ComObjects -> router stays KO-free.
  ;-D OPENKNX_LEDEFFECT_ACTIVITY_DURATION=100
  ;-D OPENKNX_DUALCORE
  ;-D TPUART_RX_TIMEOUT_DEBUG
  ;-D TPUART_RX_TIMEOUT=60

; ----------------------------------------------------------------------------
; Feature blocks -- pulled by the platform bases / per env.
; ----------------------------------------------------------------------------
[web]                                 ; web stack (config UI + console + FS). Pulled by all bases.
build_flags =
  -D OPENKNX_WEBCLIENT
  -D OPENKNX_WEBCLIENT_TEST      ; console "http get <url> [path]" -- download test aid
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE
  -D OPENKNX_WEBFS
  ;-D OPENKNX_WEBMONITOR              ; web busmonitor -- OFF: a router is a routing device (busmon is interface-only, 03_08_04 §2.2.4)

; ----------------------------------------------------------------------------
; KNX file-transfer client + console (lib/OFM-FileTransferModule). Same set as OAM-IP-Interface.
; ----------------------------------------------------------------------------
[ftc]
build_flags =
  -D OPENKNX_FTC_PROFILE_MANAGER  ; profile: security + download + dirops + fastupload + scan + deviceinfo
  -D OPENKNX_FTC_CLIENT           ; the client role -- read by lib/knx, so it must be -D. Needs knx >= 2.5.0-beta
  -D OPENKNX_FTC_CONSOLE          ; console tunnel (obj 160) -- read by OGM-Common Console.h, also never sees the module header
  -D OPENKNX_FTC_DELTA_UPDATE     ; in no profile: needs room for the rebuilt image AND the patch

; --- platform switch sets (TPUart/knx flags -- steer here, see lib/TPUart & lib/knx READMEs) ---
[flags_rp]                            ; RP2040/RP2350: TPUart
build_flags =
  ; NOTE: RX_DRAIN_FAST / TX_FAST are ESP32-only (no effect on RP) -> intentionally not here.
  -D TPUART_BCU_HEALTH
  -D TPUART_NCN_TW_AUTORESET          ; platform-agnostic; NCN TW auto-heal; U_RESET is the clean protocol reset
  ; -D TPUART_BCU_DEBUG               ; opt-in test hooks: 'bcu dis' + WD/CONr logs

[flags_esp32]                         ; ESP32: TPUart
build_flags =
  -D TPUART_BCU_HEALTH                ; 'bcu' report shows BCU<Health> + BCU<NCN-Err>
                                      ; saves 195 of 725 UART bytes per 263-octet frame; A/B-measured
  -D TPUART_NCN_TW_AUTORESET          ; NCN thermal-warning auto-heal: one guarded U_RESET on a latched TW (L1 edge-log is always on)
  ; -D TPUART_BCU_DEBUG

; ----------------------------------------------------------------------------
; Release platform bases (product + web + platform switches).
; ----------------------------------------------------------------------------
[custom_release_RP2040]
extends = RP2040_releases, custom
build_flags =
  ${RP2040_releases.build_flags}
  ${custom.build_flags}
  ${web.build_flags}
  ${flags_rp.build_flags}
  -D OPENKNX_LOOPTIME_WARNING=50      ; warn when a loop() pass exceeds this many ms

[custom_release_ESP32]
extends = ESP32_releases, custom
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
build_flags =
  ${ESP32_releases.build_flags}
  ${custom.build_flags}
  ${web.build_flags}
  ${flags_esp32.build_flags}
  -D OPENKNX_LOOPTIME_WARNING=50      ; warn when a loop() pass exceeds this many ms

; ============================================================================
; RELEASE ENVIRONMENTS  (hardware -> platformio.hardware.ini [hw_*]; features via ${ftc})
; ============================================================================

; ------ REG1 (reference boards) ------
[env:release_REG1_ETH]                   ; RP2040 16 MB, W5500 ETH, no display/SD
extends = custom_release_RP2040, hw_reg1_eth
build_flags =
  ${custom_release_RP2040.build_flags}
  ${hw_reg1_eth.build_flags}
  ${ftc.build_flags}

[env:release_REG1_LAN_TP_BASE]           ; ESP32 classic, 8 MB, native ETH
extends = custom_release_ESP32, hw_reg1_lan_tp_base
build_flags =
  ${custom_release_ESP32.build_flags}
  ${hw_reg1_lan_tp_base.build_flags}
  ${ftc.build_flags}

; ------ REG2 products (Display + SD-Card) ------
[env:release_REG2_PICO_ETH_DD]           ; RP2040 2 MB, web-flash override
extends = custom_release_RP2040, hw_reg2_pico_eth_dd
build_unflags = ${hw_reg2_pico_eth_dd.build_unflags}
build_flags =
  ${custom_release_RP2040.build_flags}
  ${hw_reg2_pico_eth_dd.build_flags}
  ${ftc.build_flags}

[env:release_REG2_PICO_W_ETH_DD]         ; RP2040 2 MB, web-flash override, LAN only
extends = custom_release_RP2040, hw_reg2_pico_w_eth_dd
build_unflags = ${hw_reg2_pico_w_eth_dd.build_unflags}
build_flags =
  ${custom_release_RP2040.build_flags}
  ${hw_reg2_pico_w_eth_dd.build_flags}
  ${ftc.build_flags}

[env:release_REG2_PICO2_ETH_DD]          ; RP2350 4 MB, web-flash override
extends = custom_release_RP2040, hw_reg2_pico2_eth_dd
build_unflags = ${hw_reg2_pico2_eth_dd.build_unflags}
build_flags =
  ${custom_release_RP2040.build_flags}
  ${hw_reg2_pico2_eth_dd.build_flags}
  ${ftc.build_flags}

[env:release_REG2_PICO_ESP_ETH_DD]       ; ESP32-S3 (Waveshare Pico), 16 MB
extends = hw_reg2_esp_eth_dd, custom_release_ESP32, ESP32_16MB   ; 16MB LAST: custom_release_ESP32 -> ESP32 base would otherwise pull the 4MB partition table back in
build_flags =
  ${custom_release_ESP32.build_flags}
  ${hw_reg2_esp_eth_dd.build_flags}
  ${ftc.build_flags}
